<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>小智 · 电商智能客服</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header id="topbar">
      <div class="brand">
        <span class="avatar">🤖</span>
        <div>
          <div class="title">小智 · 电商智能客服</div>
          <div class="subtitle">CH10 · 工具+确认流 · RAG 检索 · 三层上下文 · 主题分类旁路</div>
        </div>
      </div>
      <button id="new-chat" title="开一轮新会话">新会话</button>
    </header>

    <div id="body">
      <aside id="conv-sidebar" aria-label="会话列表">
        <div class="conv-head">会话</div>
        <div id="conv-list"></div>
      </aside>
      <main id="messages" aria-live="polite"></main>
    </div>

    <footer id="composer">
      <input id="input" type="text" placeholder="问点什么吧，如：邮费是多少 / 订单1001的物流到哪了" autocomplete="off" />
      <button id="send">发送</button>
    </footer>
  </div>

  <aside id="source-panel" aria-label="来源原文">
    <div class="source-head">
      <span>来源原文</span>
      <button id="source-close" type="button" title="关闭">✕</button>
    </div>
    <div id="source-body"></div>
  </aside>
  <script src="/chat.js"></script>
</body>
</html>
