services:
  mysql:
    image: mysql:8.4
    container_name: kefu-agent-mysql
    ports:
      # 3307 避让本机 3306 占用（见 dev-notes/ch02.md 环境查证）
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: kefu_agent
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 转义为 $，容器内读环境变量；密码与 MYSQL_ROOT_PASSWORD 一致
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  mysql-data:
