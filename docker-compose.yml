services:
  mysql:
    image: mysql:8.4
    container_name: kefu-agent-mysql
    ports:
      # 3307 避让本机 3306 占用（见 dev-notes/ch02.md 环境查证）
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: kefu_agent
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # $$ 转义为 $，容器内读环境变量；密码与 MYSQL_ROOT_PASSWORD 一致
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

# CH03 RAG 向量库形态说明：开发默认用 Milvus Lite（pip 嵌入式，文件库，见
# dev-notes/ch03.md 部署形态决策），不需要 Docker 起 Milvus 服务端。
# 若要切 Milvus standalone（etcd + minio + milvus 三容器，19530 端口），
# 需自备 S3 兼容对象存储镜像——minio 官方镜像已从 Docker Hub 下架、
# quay.io/minio/minio 需登录，本机拉不到，故未纳入默认 compose。

volumes:
  mysql-data:
