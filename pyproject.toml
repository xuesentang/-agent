[project]
name = "customer-service-chat"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<1",
  "uvicorn>=0.54,<1",
  "langchain-core>=1.6,<2",
  "langchain-openai>=1.6,<2",
  "python-dotenv>=1.2,<2",
  "SQLAlchemy>=2,<3",
  "PyMySQL>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "httpx>=0.28,<1"]

[tool.pytest.ini_options]
pythonpath = ["src"]
